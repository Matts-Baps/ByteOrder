server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy menu-service API calls
    location /api/ {
        proxy_pass http://menu-service:8000/;
        proxy_set_header Host $host;
    }

    # Proxy order-service API calls
    location /orders-api/ {
        proxy_pass http://order-service:8001/;
        proxy_set_header Host $host;
        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Proxy assistant-service calls. Model replies can take a while.
    location /assistant-api/ {
        proxy_pass http://assistant-service:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
