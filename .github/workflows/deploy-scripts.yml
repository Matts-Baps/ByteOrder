name: Deploy Scripts

on:
  push:
    branches: [main]
    paths:
      - "deploy/scripts/**"
      - ".github/workflows/deploy-scripts.yml"
      - ".github/workflows/deploy-ossway.yml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/scripts/**"
      - ".github/workflows/deploy-scripts.yml"
      - ".github/workflows/deploy-ossway.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: set-image-tag.sh tests
        run: uvx pytest -v deploy/scripts/tests
