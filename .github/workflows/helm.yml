name: Helm Chart

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm.yml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        helm: [v3.19.0, v4.3.1]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ matrix.helm }}
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Lint
        run: helm lint deploy/helm/byteorder --set clerk.publishableKey=pk,clerk.secretKey=sk
      - name: Render tests
        run: uvx --with pyyaml pytest -v deploy/helm/tests
