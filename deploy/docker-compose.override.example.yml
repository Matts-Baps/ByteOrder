# Copy this to docker-compose.override.yml and fill in your values.
#
# OpenTelemetry is configured with the standard OTEL_* variables, normally in
# deploy/.env rather than here, for example:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
#   OTEL_EXPORTER_OTLP_HEADERS=Authorization=Bearer <token>
# The services export over OTLP/HTTP, whose default port is 4318 (4317 is gRPC).
services:
  admin:
    environment:
      JWT_SECRET: "your-strong-secret-here"
      ADMIN_PASSWORD: "your-admin-password"
