{{- if and .Values.otel.browser.enabled (not .Values.otel.endpoint) }}
{{- fail "otel.browser.enabled needs otel.endpoint (an OTLP/HTTP collector) to forward browser telemetry to." }}
{{- end }}
{{- if .Values.otelEndpoint }}
{{- fail "otelEndpoint has been replaced by otel.endpoint (standard OTEL_* variables). Move the value to otel.endpoint and use the OTLP/HTTP port, usually 4318." }}
{{- end }}
{{- $services := list "menu-service" "order-service" "print-service" "admin" "frontend" }}
{{- if .Values.assistant.enabled }}
{{- $services = append $services "assistant-service" }}
{{- end }}
{{- range $svc := $services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: byteorder-{{ $svc }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: byteorder-{{ $svc }}
  template:
    metadata:
      labels:
        app: byteorder-{{ $svc }}
      {{- if eq $svc "frontend" }}
      annotations:
        # The nginx config is mounted with subPath, so running pods never see
        # ConfigMap changes. Roll the pod whenever the config changes.
        checksum/nginx-config: {{ include (print $.Template.BasePath "/frontend-nginx-config.yaml") $ | sha256sum }}
      {{- end }}
    spec:
      {{- $pullSecrets := list -}}
      {{- if $.Values.imagePullSecret -}}
        {{- $pullSecrets = append $pullSecrets $.Values.imagePullSecret -}}
      {{- end -}}
      {{- range $.Values.imagePullSecrets -}}
        {{- $pullSecrets = append $pullSecrets . -}}
      {{- end -}}
      {{- if $pullSecrets }}
      imagePullSecrets:
        {{- range $pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $svc }}
          image: {{ $.Values.registry }}/{{ $svc }}:{{ $.Values.imageTag }}
          imagePullPolicy: Always
          env:
            {{- if ne $svc "assistant-service" }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- if $.Values.postgres.enabled }}
                  name: byteorder-postgres
                  key: url
                  {{- else }}
                  name: {{ required "postgres.existingSecret is required when postgres.enabled is false" $.Values.postgres.existingSecret }}
                  key: {{ required "postgres.existingSecretKey is required when postgres.enabled is false" $.Values.postgres.existingSecretKey }}
                  {{- end }}
            {{- end }}
            {{- if ne $svc "frontend" }}
            - name: REDIS_URL
              value: redis://byteorder-redis:6379
            {{- end }}
            {{- if or (ne $svc "frontend") $.Values.otel.browser.enabled }}
            {{- if eq $svc "frontend" }}
            - name: BROWSER_TELEMETRY_ENABLED
              value: "true"
            - name: BROWSER_TELEMETRY_SAMPLE_RATE
              value: {{ $.Values.otel.browser.sampleRate | quote }}
            - name: BROWSER_TELEMETRY_SESSION_REPLAY
              value: {{ $.Values.otel.browser.sessionReplay | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: "byteorder-{{ $svc }}"
            {{- with $.Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ $.Values.otel.protocol | quote }}
            {{- end }}
            {{- with $.Values.otel.headersSecret.name }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.otel.headersSecret.key | default "headers" }}
            {{- end }}
            {{- range $name, $value := $.Values.otel.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if ne $svc "frontend" }}
            - name: AUTH_MODE
              value: {{ $.Values.authMode | quote }}
            {{- end }}
            {{- if eq $svc "admin" }}
            - name: MENU_SERVICE_URL
              value: http://byteorder-menu-service:8000
            - name: ORDER_SERVICE_URL
              value: http://byteorder-order-service:8001
            - name: TRUST_PROXY
              value: {{ $.Values.admin.trustProxy | quote }}
            {{- if eq $.Values.authMode "cloud" }}
            - name: CLERK_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ if $.Values.clerk.existingSecretName }}{{ $.Values.clerk.existingSecretName }}{{ else }}byteorder-clerk{{ end }}
                  key: publishable-key
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ if $.Values.clerk.existingSecretName }}{{ $.Values.clerk.existingSecretName }}{{ else }}byteorder-clerk{{ end }}
                  key: secret-key
            {{- else }}
            {{- $selfHostedExistingSecret := $.Values.selfHosted.existingSecretName | default "" }}
            {{- $selfHostedSecret := ternary $selfHostedExistingSecret "byteorder-self-hosted" (ne $selfHostedExistingSecret "") }}
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $selfHostedSecret }}
                  key: admin-username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $selfHostedSecret }}
                  key: admin-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $selfHostedSecret }}
                  key: jwt-secret
            - name: DEFAULT_KITCHEN_ID
              value: {{ $.Values.selfHosted.defaultKitchenId | quote }}
            {{- end }}
            {{- end }}
            {{- if or (eq $svc "menu-service") (eq $svc "order-service") }}
            {{- if eq $.Values.authMode "self-hosted" }}
            - name: DEFAULT_KITCHEN_ID
              value: {{ $.Values.selfHosted.defaultKitchenId | quote }}
            {{- end }}
            {{- end }}
            {{- if eq $svc "menu-service" }}
            {{- if eq $.Values.authMode "self-hosted" }}
            - name: DEFAULT_KITCHEN_SLUG
              value: {{ $.Values.selfHosted.defaultKitchenSlug | default $.Values.selfHosted.defaultKitchenId | quote }}
            {{- end }}
            {{- end }}
            {{- if eq $svc "assistant-service" }}
            - name: MENU_SERVICE_URL
              value: http://byteorder-menu-service:8000
            - name: OLLAMA_URL
              value: {{ required "assistant.ollamaUrl is required when assistant.enabled is true" $.Values.assistant.ollamaUrl | quote }}
            - name: OLLAMA_MODEL
              value: {{ $.Values.assistant.ollamaModel | quote }}
            {{- with $.Values.assistant.ollamaNumCtx }}
            - name: OLLAMA_NUM_CTX
              value: {{ . | quote }}
            {{- end }}
            - name: RATE_LIMIT_PER_CLIENT_PER_MINUTE
              value: {{ $.Values.assistant.rateLimitPerClientPerMinute | quote }}
            - name: RATE_LIMIT_PER_KITCHEN_PER_MINUTE
              value: {{ $.Values.assistant.rateLimitPerKitchenPerMinute | quote }}
            - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
              value: {{ $.Values.assistant.captureMessageContent | quote }}
            {{- if eq $.Values.authMode "self-hosted" }}
            - name: DEFAULT_KITCHEN_ID
              value: {{ $.Values.selfHosted.defaultKitchenId | quote }}
            {{- end }}
            {{- end }}
          {{- if eq $svc "frontend" }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          {{- end }}
          {{- with index $.Values.resources $svc }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if eq $svc "frontend" }}
      volumes:
        - name: nginx-config
          configMap:
            name: byteorder-frontend-nginx
      {{- end }}
{{ end }}

{{- /* Services (k8s Service objects) */ -}}
---
apiVersion: v1
kind: Service
metadata:
  name: byteorder-menu-service
spec:
  selector:
    app: byteorder-menu-service
  ports:
    - port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: byteorder-order-service
spec:
  selector:
    app: byteorder-order-service
  ports:
    - port: 8001
{{- if .Values.assistant.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: byteorder-assistant-service
spec:
  selector:
    app: byteorder-assistant-service
  ports:
    - port: 8002
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: byteorder-admin
spec:
  selector:
    app: byteorder-admin
  ports:
    - port: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: byteorder-frontend
spec:
  selector:
    app: byteorder-frontend
  ports:
    - port: 80
